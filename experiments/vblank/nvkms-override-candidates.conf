# Syntax of nvidia_modeset.config_file, confirmed from the REAL SOURCE (not binary RE):
# /usr/src/nvidia-595.71.05/src/nvidia-modeset/src/nvkms-conf.c (open-source part of the 595
# driver, SPDX MIT). All three previous candidates (from RE of the .ko) failed: the first one
# (A, path between <angle-brackets>) threw "Unknown GPU designator: 0000:05:00" and aborted the
# file entirely before getting to test B and C -- nvKmsReadConf tears down on the first error.
#
# The cause: the key splits keyhead ("override") from keytail at the FIRST '.', so the whole
# "0000:05:00.0.DP-1" gets passed whole to Subparser_override. That parser only activates the
# PCI-address branch when key[0] == '[' (nvkms-conf.c:126). Without brackets, it looks for the first
# loose '.' -- which falls after the "05:00" of the bus, not after the function -- and reads
# "0000:05:00" as if it were the whole designator. It doesn't match "tegra" or "rm-soc-disp" and
# throws exactly the warning we saw.
#
# Real grammar (nvkms-conf.c:103-265):
#   override.[<domain>:<bus>.<slot>.<function>].<dpy-name> = <value>
#   (the brackets are LITERAL, not optional notation; inside them . and : are
#   hex delimiters for 4 fields, exactly like in `lspci`/DRM: 0000:05:00.0)
#   value: if it starts with '/' (after stripping quotes if present) => path to a file with the
#   raw EDID. The '<angle-brackets>' are NOT stripped -- they remain as a literal part of the value, so
#   they're never the correct form for a path.

