# Sintaxis de nvidia_modeset.config_file, confirmada por FUENTE real (no RE de binario):
# /usr/src/nvidia-595.71.05/src/nvidia-modeset/src/nvkms-conf.c (parte abierta del 595,
# SPDX MIT). Los tres candidatos anteriores (por RE del .ko) fallaron los tres: el primero
# (A, ruta entre <angulos>) tiró "Unknown GPU designator: 0000:05:00" y abortó el archivo
# entero antes de llegar a probar B y C -- nvKmsReadConf hace teardown en el primer error.
#
# La causa: la clave separa keyhead ("override") de keytail en el PRIMER '.', así que todo
# "0000:05:00.0.DP-1" se pasa entero a Subparser_override. Ese parser sólo activa el branch
# de direccion PCI cuando key[0] == '[' (nvkms-conf.c:126). Sin corchetes, busca el primer
# '.' suelto -- que cae despues del "05:00" del bus, no despues de la funcion -- y lee
# "0000:05:00" como si fuera el designador completo. No matchea "tegra" ni "rm-soc-disp" y
# tira exactamente el warning que vimos.
#
# Gramatica real (nvkms-conf.c:103-265):
#   override.[<dominio>:<bus>.<slot>.<funcion>].<nombre-dpy> = <valor>
#   (los corchetes son LITERALES, no notacion opcional; dentro de ellos . y : son
#   delimitadores hex de 4 campos, exactamente como en `lspci`/DRM: 0000:05:00.0)
#   valor: si empieza con '/' (tras pelar comillas si las hay) => ruta a archivo con el
#   EDID crudo. Los '<angulos>' NO se pelan -- quedan como parte literal del valor, asi que
#   nunca son la forma correcta para una ruta.

# CORREGIDO (2026-08-05, tarde): DP-1 no matcheaba. Confirmado por fuente
# (nvkms-rm.c:880, allocConnectorDispData = { } -- typeIndices arranca en 0) que el
# nombre INTERNO de NVKMS para el primer conector DP es "DP-0" (0-based), mientras que
# DRM lo expone como "DP-1" (1-based: nunca aparece "DP-0" en /sys/class/drm/). Mismo
# conector físico, dos nombres distintos. DPY_OVERRIDE_MATCHES compara contra el nombre
# INTERNO (nvkms-dpy-override.c:210, pConnectorEvo->name), asi que la clave correcta es
# DP-0, no DP-1. Se leyó sin error de sintaxis (bufflen != 0, parseo OK) pero nunca hizo
# match: probado con `cat /sys/class/drm/card0-DP-1/status` (fuerza detect() real, ver
# nvidia-drm-connector.c:274-301) y el EDID activo siguió siendo el original.
# CONFIRMADO (2026-08-05, noche): con la clave DP-0, esta vía carga de punta a punta --
# DRM pasó de ver 3 modos a 6, y el HID del casco confirmó timing byte-perfecto en el
# factorial de docs/16 (CTRL/B/A, los tres 2880x1440 inyectados en el bloque base). Los
# tres fallaron igual (logo HP, sin video) -- pero 2880x1440 nunca mostró nada a ningún
# refresh en este proyecto, así que ese resultado está confundido con la resolución, no
# con el vblank. Detalle en docs/16, sección "Corrido (2026-08-05): CTRL falla".
#
# Segunda ronda: mismo mecanismo, pero inyectando en los descriptores DisplayID Type I
# (4320x2160, `edid-tool.py inject-did`) en vez del bloque base -- ahí SÍ hay un caso
# confirmado que anda (el descriptor #2, @60), así que no hay confound de resolución.
# El .edid que hace falta cambiar es el ARCHIVO al que apunta esta línea; el módulo lo lee
# una sola vez al cargar (nvkms-dpy-override.c: DpyOverrideReadEdid copia a un buffer en
# memoria), así que cada EDID nuevo necesita su propio reboot. Orden: CTRL4K -> B4K -> A4K.
#
# 1/3, CTRL4K (2026-08-05 noche): misma forma que el descriptor #2 real que anda (vblank
# 514, @60), pero escrito en el descriptor #1. Si esto tampoco enciende, ni siquiera
# clonar el modo que funciona a la otra posición alcanza -- apuntaría a algo posicional
# (cuál de los dos descriptores, o cuál es "preferred") en vez del timing.
# RESULTADO (T012): ANDA -- colores alternando, HID confirma 60Hz y backlight prendido.
# El descriptor #1 no es la causa. Sigue B4K: mismo descriptor, 90Hz, vblank corto (240).
# RESULTADO (T013): FALLA -- solo logo HP. HID ni siquiera reporto 90 (se quedo en 60,
# el ultimo estado conocido de CTRL4K) -- ver docs/16 para el detalle sin explicar todavia.
# Sigue A4K: mismo descriptor, 60Hz (no 90), vblank corto (116) -- separa refresh de vblank.
# RESULTADO (T014): FALLA tambien -- cierra el factorial. CTRL4K (60/vblank514) anda,
# A4K (60/vblank116) y B4K (90/vblank240) fallan los dos. No es el refresh, es el vblank
# corto -- y no es bandwidth (A4K corre a 603.6MHz, lejos del techo HBR3, y falla igual).
# Candidato directo al objetivo real: 90Hz con el vblank largo que SI anda (514), el mismo
# 25.53 Gbps @24bpp que ya se habia calculado, pegado pero dentro del techo HBR3 (25.92).
# RESULTADO (T015): FALLA. HID esta vez SI confirmo 90Hz y timing exacto (a diferencia de
# B4K, que se habia quedado en el estado viejo) -- asi que no es que el modo no haya
# llegado, es que 90Hz con vblank514 tampoco alcanza. Los 4 resultados ordenan limpio por
