# Example nvidia_modeset.config_file: override one connector's EDID with a file.
# Syntax confirmed from the driver source (src/nvidia-modeset/src/nvkms-conf.c, SPDX MIT):
#
#   override.[<domain>:<bus>:<slot>.<function>].<dpy-name> = <path-to-raw-EDID-file>
#
# - The brackets around the PCI address are LITERAL. Without them the key is split at the
#   first '.' and the address is mis-parsed ("Unknown GPU designator"), and nvKmsReadConf
#   aborts the whole file on the first error.
# - <dpy-name> is NVKMS's INTERNAL connector name, which is 0-based ("DP-0"), while DRM
#   exposes the same connector 1-based ("DP-1"). Use the internal name.
# - A value starting with '/' is a path to a raw EDID. Angle brackets are not stripped.
# - The module reads the file once at load time, so every new EDID needs a reboot or reload.
# - Force a detect with `cat /sys/class/drm/card0-DP-1/status` and compare the active EDID.
#
# Replace the PCI address with your GPU's (`lspci -D`) and the path with your EDID file.
# Build variants with scripts/edid-tool.py. The injected-timing experiment this was used for
# is documented in docs/16-lab-vblank.md (its central conclusion was wrong: the cause was
# the 6 bpc clamp, patches/nvidia/0004).
override.[0000:05:00.0].DP-0 = /path/to/your-edid.bin
