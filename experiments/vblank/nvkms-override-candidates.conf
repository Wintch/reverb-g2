# refresh solo: CTRL4K 3.204ms PASA, 90long 2.136ms FALLA, B4K 1.111ms FALLA, A4K 0.849ms
# FALLA. El techo de HBR3 a 90Hz limita el vblank maximo a ~555 lineas (~2.27ms) -- por
