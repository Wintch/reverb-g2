# Disables the HP Reverb G2's own USB audio codec (Realtek 0bda:4c15, behind the WMR hub).
# This device cycles disconnect/reconnect every ~30s on this specific unit - confirmed
# hardware-inherent (same symptom on Windows, not autosuspend), see
# reverb-g2/docs/06-known-issues.md. Not necessarily a defect of the G2 model in general -
# may be specific to this unit's condition. Disabling it here only stops the repeated
# KDE "device connected/disconnected" popup; it does not touch the video/tracking/sensor
# USB interfaces of the headset, which are unrelated.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id = "0bda"
        device.product.id = "4c15"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
