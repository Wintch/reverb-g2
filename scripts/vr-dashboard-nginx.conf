# /etc/nginx/sites-available/vr-dashboard -- reverse proxy for the VR lab
# status dashboard (status-dashboard.py, bound to 127.0.0.1:8765 on purpose,
# never exposed directly). This is the deliberate "proper" way to put it on
# the LAN instead of an SSH tunnel per client -- nginx is the actual network
# edge, the Python server stays localhost-only.
#
# LAN-only by explicit allowlist, not just "nobody's forwarded the port" --
# defense in depth for a box that also has the lab's real hardware on it.
#
# EXAMPLE FILE, not a template to deploy as-is (2026-08-23): `iashur`/
# `iashur.internal` and the `192.168.1.0/24` subnet below are THIS box's
# hostname and LAN, hardcoded. Anyone else's machine has a different
# hostname and a different LAN -- copying this file verbatim leaks this
# rig's identity into someone else's nginx config for no reason. Kept here
# as a worked reference (the proxy_pass/allowlist shape is the reusable
# part), not wired into any installer yet. Real fix, not done: a proper
# per-box installer that asks for (or detects) hostname/LAN and generates
# this file, instead of a human hand-editing a copy every time -- same
# spirit as vr-power-setup.sh's ~/vr/power.conf (per-box values out of the
# script, not hardcoded in it).

server {
    listen 8080;
    listen [::]:8080;
    server_name iashur.internal iashur;  # CHANGE per box -- this machine's hostname

    allow 192.168.1.0/24;  # CHANGE per box -- this machine's LAN subnet
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
